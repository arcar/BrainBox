
@if (chargement) {

<p>
  Chargement...
</p>

}

@else {
    <p>


<section class="form-page">


<h1>
{{ modeModification 
? 'Modifier une connaissance'
: 'Ajouter une connaissance'
}}
</h1>


<div class="form-group">

<label>
Titre
</label>

<input
type="text"
name="title"
[(ngModel)]="connaissance.title">

</div>



<div class="form-group">

<label>
Contenu
</label>

<textarea
name="content"
rows="8"
[(ngModel)]="connaissance.content">
</textarea>

</div>



<div class="form-group">

<label>
Tags
</label>

<input
type="text"
name="tags"
[(ngModel)]="tagsTexte">

</div>



<div class="form-group">

<label>
Couleur
</label>

<input
type="color"
name="color"
[(ngModel)]="connaissance.color">

</div>



<div>

<label>

<input
type="checkbox"
name="pinned"
[(ngModel)]="connaissance.pinned">

📌 Épinglée

</label>

</div>



<div>

<label>

<input
type="checkbox"
name="archived"
[(ngModel)]="connaissance.archived">

📦 Archivée

</label>

</div>



<div class="actions">

<button
(click)="enregistrer()">

💾
{{modeModification ? 'Modifier':'Ajouter'}}

</button>


<button
(click)="annuler()">

❌ Annuler

</button>

</div>


</section>

}
