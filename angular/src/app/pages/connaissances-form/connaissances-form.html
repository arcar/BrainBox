<section class="form-page">


    <div class="formulaire">



        <header class="form-header">


            <h1>

                {{ modeModification 
                ? '✏️ Modifier une connaissance'
                : '➕ Ajouter une connaissance'
                }}

            </h1>


            <p>

                Gestion intelligente de votre base BrainBox

            </p>


        </header>





        <div class="form-group">


            <label>

                Titre

            </label>


            <input

            type="text"

            name="title"

            [(ngModel)]="connaissance.title"

            placeholder="Titre de la connaissance">


        </div>







        <div class="form-group">


            <label>

                Contenu

            </label>


            <textarea

            name="content"

            rows="10"

            [(ngModel)]="connaissance.content"

            placeholder="Décrivez votre connaissance...">

            </textarea>


        </div>








        <div class="form-group">


            <label>

                Tags

            </label>


            <input

            type="text"

            name="tags"

            [(ngModel)]="tagsTexte"

            placeholder="docker, angular, mongodb">


        </div>







        <div class="form-group color-group">


            <label>

                Couleur

            </label>


            <input

            type="color"

            name="color"

            [(ngModel)]="connaissance.color">


        </div>







        <div class="options">


            <label>


                <input

                type="checkbox"

                name="pinned"

                [(ngModel)]="connaissance.pinned">


                📌 Épinglée


            </label>





            <label>


                <input

                type="checkbox"

                name="archived"

                [(ngModel)]="connaissance.archived">


                📦 Archivée


            </label>



        </div>








        <div class="actions">



            <button

            class="save"

            type="button"

            (click)="enregistrer()">



                💾

                {{modeModification 
                ? 'Modifier'
                : 'Ajouter'}}



            </button>







            <button

            class="cancel"

            type="button"

            (click)="annuler()">



                ❌ Annuler



            </button>




        </div>





    </div>



</section>
