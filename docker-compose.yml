services:
  api:    
    build:
      context: ./api
      dockerfile: Dockerfile
    image: arcar13/brainbox:backend
    container_name: brainbox-api
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    env_file:
      - ./api/.env
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama


  ollama:
    image: ollama/ollama
    container_name: brainbox-ollama
    ports:
      - "11434:11434"
    env_file:
      - ./api/.env
    volumes:
      - ./LLM:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    